{% extends "frontend/base.html" %}

{% block title %}Sign In | AlphaMinds{% endblock %}

{% block content %}
<section class="max-w-xl mx-auto px-4 py-16">
  <div class="rounded-3xl border border-am-border bg-am-surface p-8">
    <h1 class="text-3xl font-bold text-am-cyan">Sign In</h1>
    <p class="mt-2 text-zinc-400">Use your AlphaMinds account credentials.</p>

    <form method="post" class="mt-8 space-y-5">
      {% csrf_token %}
      {{ form.non_field_errors }}

      <div>
        <label class="block mb-2 text-sm text-zinc-300">Username</label>
        {{ form.username }}
      </div>

      <div>
        <label class="block mb-2 text-sm text-zinc-300">Password</label>
        {{ form.password }}
      </div>

      <button type="submit" class="w-full px-5 py-3 rounded-2xl am-gradient-bg text-white font-bold">
        Continue
      </button>
    </form>
  </div>
</section>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const fields = [
      document.getElementById("id_username"),
      document.getElementById("id_password")
    ];

    fields.forEach(function (field) {
      if (!field) return;
      field.className = "w-full rounded-xl border border-am-border bg-am-alt px-4 py-3 text-white placeholder-am-dim focus:outline-none focus:ring-2 focus:ring-am-cyan";
    });

    const username = document.getElementById("id_username");
    const password = document.getElementById("id_password");

    if (username) username.setAttribute("placeholder", "Enter username");
    if (password) password.setAttribute("placeholder", "Enter password");
  });
</script>
{% endblock %}
