<div>
  <div class="mb-5">
    <div class="text-xs uppercase tracking-[0.16em] text-am-cyan">Inquiry Type</div>
    <h4 class="mt-2 text-xl font-semibold text-white">{{ form_title }}</h4>
  </div>

  <form method="post"
        hx-post="{% url 'frontend:contact_submit' %}"
        hx-target="#contact-form-content"
        hx-swap="innerHTML"
        class="space-y-5">
    {% csrf_token %}
    <input type="hidden" name="inquiry_type" value="{{ inquiry_type }}">

    {% for field in form %}
      <div>
        <label class="block mb-2 text-sm text-zinc-300">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}
          <div class="mt-1 text-sm text-red-400">{{ field.errors }}</div>
        {% endif %}
        {% if field.help_text %}
          <div class="mt-1 text-xs text-zinc-500">{{ field.help_text }}</div>
        {% endif %}
      </div>
    {% endfor %}

    <div class="pt-2">
      <button type="submit"
              class="w-full px-5 py-3 rounded-2xl am-gradient-bg text-white font-bold hover:opacity-95 transition">
        Submit Enquiry
      </button>
    </div>
  </form>
</div>
