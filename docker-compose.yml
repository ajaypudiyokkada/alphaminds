# AlphaMinds production stack: backend (gunicorn) + postgres only.
# Run from the repo root:  docker compose --env-file backend/.env up -d --build
# nginx on the host proxies to 127.0.0.1:8010; nothing else is published.
name: alphaminds

services:
  db:
    image: postgres:16
    container_name: alphaminds_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # no "ports": the database is reachable only from the backend container
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    image: alphaminds_backend:latest
    container_name: alphaminds_backend
    restart: unless-stopped
    env_file: backend/.env
    environment:
      DB_ENGINE: django.db.backends.postgresql
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn alphaminds.wsgi:application --bind 0.0.0.0:8000 --workers 3
             --access-logfile - --forwarded-allow-ips='*'"
    ports:
      - "127.0.0.1:8010:8000"   # loopback only; nginx is the public entry point
    networks: [internal]

networks:
  internal:
    name: alphaminds_internal

volumes:
  pgdata:
    name: alphaminds_pgdata
